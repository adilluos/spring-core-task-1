    maxAttempts: 3
    lockMinutes: 5

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

service-auth:
  shared-secret: "change-this-to-a-strong-64+char-secret"
  issuer: "firsttask"
  audience: "workload-service"
  ttl-minutes: 15